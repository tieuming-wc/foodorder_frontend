<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0c0a">
  <title>Đăng nhập quản trị | Savoris</title>
  <link rel="icon" href="../assets/images/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/savoris.css">
</head>
<body data-root="../">
  <main class="sv-page sv-auth">
    <div class="sv-auth__card">
      <a class="sv-brand" href="../index.html" aria-label="Savoris — về trang chủ">
        <svg class="sv-brand__mark" width="15" height="9" viewBox="0 0 15 9" fill="none" stroke="currentColor"
          stroke-width="1.2" stroke-linecap="round" aria-hidden="true"><path d="M1 8 7.5 1 14 8"/></svg>
        <span class="sv-brand__name">Savoris</span>
      </a>

      <p class="sv-auth__eyebrow">Khu vực quản trị</p>
      <h1 class="sv-display">Đăng nhập</h1>
      <p class="sv-page-head__meta">Chỉ tài khoản có vai trò <strong>ADMIN</strong> mới vào được bảng điều khiển.</p>

      <p class="sv-auth__notice" id="login-notice" role="status" hidden></p>

      <form class="sv-auth__form" id="login-form" novalidate>
        <div class="sv-field">
          <label for="login-email">Email</label>
          <input class="sv-input" id="login-email" name="email" type="email" autocomplete="username"
            placeholder="admin@savoris.vn" required>
        </div>

        <div class="sv-field">
          <label for="login-password">Mật khẩu</label>
          <input class="sv-input" id="login-password" name="password" type="password"
            autocomplete="current-password" placeholder="••••••••" required>
        </div>

        <button class="sv-btn sv-btn--gold" id="login-submit" type="submit">Đăng nhập</button>

        <a class="sv-btn sv-btn--ghost" id="login-guest-link" href="../index.html" hidden>Về trang khách</a>
      </form>

      <p class="sv-auth__foot muted"><a href="../index.html" style="text-decoration:none">← Về trang khách</a></p>
      <p class="sv-auth__hint">Chưa có tài khoản? Liên hệ quản trị viên nhà hàng để được cấp quyền.</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/pages/login.js"></script>
</body>
</html>

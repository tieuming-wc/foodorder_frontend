<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giỏ hàng | KS25 Base</title>
  <link rel="icon" href="../assets/images/logo.svg">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-root="../">
  <header id="app-header"></header>

  <main class="container cart-page">
    <div class="cart-head">
      <div>
        <h1>Giỏ hàng</h1>
        <p class="muted" id="cart-subtitle"></p>
      </div>
      <a href="items.html" class="btn btn-ghost">← Tiếp tục chọn món</a>
    </div>

    <!-- Giỏ trống -->
    <div id="cart-empty" class="cart-empty-state" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 6h15l-1.6 8.4a2 2 0 0 1-2 1.6H8.8a2 2 0 0 1-2-1.6L5 3H3"></path>
        <circle cx="9.5" cy="20" r="1.4"></circle>
        <circle cx="17.5" cy="20" r="1.4"></circle>
      </svg>
      <h2>Giỏ hàng đang trống</h2>
      <p class="muted">Bạn chưa chọn món nào. Ghé trang món để thêm món vào giỏ nhé.</p>
      <a href="items.html" class="btn btn-primary">← Quay lại trang món</a>
    </div>

    <!-- Giỏ có món -->
    <div id="cart-filled" class="cart-layout" hidden>
      <section id="cart-body" class="cart-lines" aria-live="polite"></section>

      <aside class="cart-side">
        <div class="card">
          <h2>Tóm tắt đơn</h2>
          <div class="cart-sum-row">
            <span>Số món</span>
            <span id="cart-count">0</span>
          </div>
          <div class="cart-sum-row cart-sum-total">
            <span>Tổng cộng</span>
            <strong id="cart-total">0 ₫</strong>
          </div>
          <button id="btn-checkout" type="button" class="btn btn-primary">Tiến hành đặt hàng</button>
          <p class="cart-side-note">Kiểm tra lại món và số lượng trước khi đặt.</p>
        </div>
      </aside>
    </div>
  </main>

  <footer id="app-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pages/cart.js"></script>
</body>
</html>

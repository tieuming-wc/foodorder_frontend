<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0c0a">
  <title>Đơn hàng · Admin Savoris</title>
  <link rel="icon" href="../assets/images/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/admin.css">
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin/guard.js"></script>
</head>
<body class="ad-body" data-admin-page="orders">
  <div class="ad-app" id="ad-app">
    <aside id="ad-sidebar"></aside>

    <div class="ad-main">
      <header id="ad-topbar"></header>

      <main class="ad-content">
        <div class="ad-page-head">
          <h1 class="ad-title">Đơn hàng</h1>
          <p class="ad-sub">Theo dõi và xử lý đơn hàng trong ngày.</p>
        </div>

        <section class="ad-card" aria-label="Danh sách đơn hàng">
          <div class="ad-chips" id="ad-order-chips" style="margin-bottom:14px"></div>

          <div class="ad-table-wrap">
            <table class="ad-table">
              <thead>
                <tr>
                  <th>Mã đơn</th>
                  <th>Khách hàng</th>
                  <th>Số món</th>
                  <th>Tổng tiền</th>
                  <th>Trạng thái</th>
                  <th class="ad-t-right">Thao tác</th>
                </tr>
              </thead>
              <tbody id="ad-order-rows"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="../js/utils.js"></script>
  <script src="../js/admin/layout.js"></script>
  <script src="../js/admin/pages.js"></script>
</body>
</html>

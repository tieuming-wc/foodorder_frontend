<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phản hồi · Admin Savoris</title>
    <link rel="stylesheet" href="../css/admin.css" />
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/admin/guard.js"></script>
  </head>
  <body class="ad-body" data-admin-page="feedback">
    <div class="ad-app" id="ad-app">
      <aside id="ad-sidebar"></aside>
      <div class="ad-main">
        <header id="ad-topbar"></header>
        <main class="ad-content">
          <div class="ad-page-head">
            <h1 class="ad-title">Phản hồi</h1>
            <p class="ad-sub">Theo dõi đánh giá và phản hồi khách hàng.</p>
          </div>
          <section class="ad-card">
            <div class="ad-table-wrap">
              <table class="ad-table">
                <thead>
                  <tr>
                    <th>Khách hàng</th>
                    <th>Đánh giá</th>
                    <th>Nội dung</th>
                    <th>Trạng thái</th>
                    <th class="ad-t-right">Thao tác</th>
                  </tr>
                </thead>
                <tbody id="ad-feedback-rows"></tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>
    <script src="../js/utils.js"></script>
    <script src="../js/admin/layout.js"></script>
    <script src="../js/admin/pages.js"></script>
  </body>
</html>

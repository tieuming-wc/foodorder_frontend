<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0c0a">
  <title>Bếp trực tiếp · Admin Savoris</title>
  <link rel="icon" href="../assets/images/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/admin.css">
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin/guard.js"></script>
</head>
<body class="ad-body" data-admin-page="kitchen">
  <div class="ad-app" id="ad-app">
    <aside id="ad-sidebar"></aside>

    <div class="ad-main">
      <header id="ad-topbar"></header>

      <main class="ad-content">
        <div class="ad-page-head">
          <div class="ad-page-head__row">
            <div>
              <h1 class="ad-title">Bếp trực tiếp</h1>
              <p class="ad-sub">Theo dõi các đơn đang chờ chế biến và đang giao theo thời gian thực.</p>
            </div>
            <div style="display:flex;align-items:center;gap:12px">
              <span class="ad-live-dot" id="ad-kitchen-live">Tự động cập nhật 30s</span>
              <button class="ad-btn" type="button" id="ad-kitchen-refresh">
                <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 4v5h-5M3 16v-5h5"/><path d="M4.6 7A7 7 0 0 1 16.4 5.5L17 9M15.4 13A7 7 0 0 1 3.6 14.5L3 11"/></svg>
                Làm mới
              </button>
            </div>
          </div>
        </div>

        <div class="ad-chips" id="ad-kitchen-chips" style="margin-bottom:16px"></div>

        <section class="ad-kitchen-grid" id="ad-kitchen-grid" aria-label="Danh sách đơn bếp"></section>
      </main>
    </div>
  </div>

  <script src="../js/utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/admin/layout.js"></script>
  <script src="../js/admin/pages.js"></script>
</body>
</html>

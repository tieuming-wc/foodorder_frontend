<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0c0a">
  <title>Tài khoản · Admin Savoris</title>
  <link rel="icon" href="../assets/images/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/admin.css">
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin/guard.js"></script>
</head>
<body class="ad-body" data-admin-page="users">
  <div class="ad-app" id="ad-app">
    <aside id="ad-sidebar"></aside>

    <div class="ad-main">
      <header id="ad-topbar"></header>

      <main class="ad-content">
        <div class="ad-page-head">
          <h1 class="ad-title">Tài khoản</h1>
          <p class="ad-sub">Kiểm duyệt và bảo vệ cộng đồng Savoris.</p>
        </div>

        <div class="ad-split">
          <section class="ad-card" aria-label="Danh sách tài khoản">
            <div class="ad-toolbar">
              <div class="ad-search">
                <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"
                  stroke-linecap="round" aria-hidden="true"><circle cx="8.8" cy="8.8" r="5.3"/><path d="m13 13 4 4"/></svg>
                <label class="ad-label" for="ad-user-search" style="position:absolute;left:-9999px">Tìm tài khoản</label>
                <input class="ad-input" id="ad-user-search" type="search" autocomplete="off"
                  placeholder="Tìm tên, email hoặc số điện thoại…">
              </div>
            </div>

            <div class="ad-chips" id="ad-user-chips" style="margin-bottom:14px"></div>

            <div class="ad-table-wrap">
              <table class="ad-table">
                <thead>
                  <tr>
                    <th>Tài khoản</th>
                    <th>Vai trò</th>
                    <th>Trạng thái</th>
                    <th class="ad-t-right">Thao tác</th>
                  </tr>
                </thead>
                <tbody id="ad-user-rows"></tbody>
              </table>
            </div>
          </section>

          <aside class="ad-panel">
            <section class="ad-card" aria-labelledby="ad-user-detail-title">
              <div class="ad-card__head">
                <h2 class="ad-card__title" id="ad-user-detail-title">Hồ sơ tài khoản</h2>
              </div>
              <div id="ad-user-detail"></div>
            </section>
          </aside>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/utils.js"></script>
  <script src="../js/admin/layout.js"></script>
  <script src="../js/admin/pages.js"></script>
</body>
</html>
